<!doctype html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">


<title>LORN·TL - อ่านมังงะแปลไทย</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</head>

<body>

<nav class="navbar">
    <a href="index.html" class="logo"><span>LORN·TL</span></a>

    <div class="nav-menu">
        <a href="index.html" class="active">🏠 หน้าแรก</a>
        <a href="#" onclick="showAll(event)">📚 รายชื่อมังงะ</a>
        <a href="#" onclick="showBookmarks(event)"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" style="vertical-align:-2px;"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg> บุ๊กมาร์ก</a>
    </div>

    <div style="display:flex; gap:12px; align-items:center;">
        <div class="nav-search">
            🔍
            <input id="searchInput" placeholder="ค้นหามังงะ..." oninput="render()">
        </div>
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙</button>
        <button class="btn-google" id="googleLoginBtn" onclick="loginGoogle()" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C41.4 34.9 44 30 44 24c0-1.3-.1-2.7-.4-3.9z"/></svg>
            เข้าสู่ระบบ
        </button>
        <div class="user-chip hidden" id="userChip">
            <img id="userPic" src="" alt="">
            <span id="userName"></span>
            <button onclick="logoutGoogle()" title="ออกจากระบบ">✕</button>
        </div>
    </div>
</nav>

<div class="hero">
    <div class="hero-content">
        <h1><span class="emoji">📚</span> <span class="grad-text">LORN·TL</span></h1>
        <p>หลอนจนแปล — รวมมังงะแปลไทย อัปเดตตอนใหม่ทุกวัน</p>
    </div>
</div>

<div class="container">

    <!-- มังงะยอดนิยม -->
    <div class="popular-section">
        <h2 class="popular-title">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="url(#fireGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-5px;">
                <defs>
                    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#c084fc"/>
                        <stop offset="100%" stop-color="#818cf8"/>
                    </linearGradient>
                </defs>
                <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
            </svg>
            มังงะยอดนิยม
        </h2>
        <div class="popular-scroll" id="popularList"></div>
    </div>

    <div class="card" id="categoryBar" style="display:flex; flex-wrap:wrap; gap:8px;"></div>

    <div id="manga-list" style="margin-top:25px;"></div>
    <div id="loading" class="loading">กำลังโหลด...</div>

</div>

<script src="firebase.js"></script>
<script src="toast.js"></script>
<script>

let mangas = [];
let category = "ทั้งหมด";
let mode = "all"; // all | bookmark

// รับหมวดจาก URL เช่น index.html?cat=ความรัก
const urlCat = new URLSearchParams(location.search).get("cat");
if(urlCat) category = urlCat;

// ================= GOOGLE AUTH =================

function loginGoogle(){
    const provider = new firebase.auth.GoogleAuthProvider();
    const isLocal = location.hostname === "localhost" || location.hostname === "127.0.0.1";

    if(isLocal){
        // localhost — ใช้ popup ได้
        auth.signInWithPopup(provider).catch(e=>{
            // popup ไม่ได้ -> เปลี่ยนเป็น redirect เงียบ ๆ (ไม่แจ้งเตือน)
            if(["auth/popup-blocked","auth/popup-closed-by-user","auth/cancelled-popup-request","auth/operation-not-supported-in-this-environment"].includes(e.code)){
                auth.signInWithRedirect(provider);
            } else if(e.code !== "auth/popup-closed-by-user"){
                alert("ล็อกอินไม่สำเร็จ: " + e.message);
            }
        });
    } else {
        // GitHub Pages ฯลฯ — ใช้ redirect (popup มักโดนบล็อก)
        auth.signInWithRedirect(provider);
    }
}

function logoutGoogle(){
    auth.signOut();
}

auth.getRedirectResult().catch(e=>{
    // แจ้งเฉพาะล็อกอินล้มเหลวจริง ๆ
    if(e && !["auth/no-auth-event","auth/operation-not-supported-in-this-environment"].includes(e.code)){
        alert("ล็อกอินไม่สำเร็จ: " + e.message);
    }
});

auth.onAuthStateChanged(user=>{
    const isGoogle = user && user.providerData.some(p=> p.providerId === "google.com");
    const chip = document.getElementById("userChip");
    const btn = document.getElementById("googleLoginBtn");

    if(isGoogle){
        btn.style.display = "none";
        chip.classList.remove("hidden");
        document.getElementById("userPic").src = user.photoURL || "";
        document.getElementById("userName").textContent =
            (user.displayName || "ผู้ใช้").split(" ")[0];
    } else {
        btn.style.display = "inline-flex";
        chip.classList.add("hidden");
    }
});

// ================= THEME =================

function toggleTheme(){
    const goingLight = !document.body.classList.contains("light-mode");
    const apply = ()=>{
        document.body.classList.toggle("light-mode", goingLight);
        localStorage.setItem("theme", goingLight ? "light" : "dark");
        document.getElementById("themeBtn").textContent = goingLight ? "☀️" : "🌙";
    };

    // ใช้ View Transitions API — เฟดจริงระหว่างธีมเก่า/ใหม่ ไม่มีสีทับ
    if(document.startViewTransition){
        document.startViewTransition(apply);
    } else {
        apply();
    }
}

if(localStorage.getItem("theme") === "light"){
    document.body.classList.add("light-mode");
    window.addEventListener("DOMContentLoaded", ()=> document.getElementById("themeBtn").textContent = "☀️");
}

// ================= BOOKMARKS =================

function getBookmarks(){
    return JSON.parse(localStorage.getItem("bookmarks") || "[]");
}

function toggleBookmark(id, event){
    event.stopPropagation();
    let bm = getBookmarks();
    const i = bm.indexOf(id);
    if(i >= 0) bm.splice(i,1); else bm.push(id);
    localStorage.setItem("bookmarks", JSON.stringify(bm));
    render();
}

function isBookmarked(id){
    return getBookmarks().includes(id);
}

// ================= MODE =================

function showAll(e){
    if(e) e.preventDefault();
    mode = "all";
    setActiveMenu(1);
    render();
}

function showBookmarks(e){
    if(e) e.preventDefault();
    mode = "bookmark";
    setActiveMenu(2);
    render();
}

function setActiveMenu(i){
    document.querySelectorAll(".nav-menu a").forEach((a,idx)=> a.classList.toggle("active", idx===i));
}

// ================= CATEGORIES =================

async function loadCategories(){
    const bar = document.getElementById("categoryBar");
    bar.innerHTML = "";
    const snap = await db.collection("categories").get();

    const mk = (name)=>{
        const b = document.createElement("button");
        b.className = "tag-badge cat";
        b.style.cursor = "pointer";
        b.style.opacity = (name===category) ? "1" : ".55";
        b.textContent = name;
        b.onclick = ()=>{ category = name; loadCategories(); render(); };
        bar.appendChild(b);
    };

    mk("ทั้งหมด");
    snap.forEach(doc=>{ if(doc.data().name) mk(doc.data().name); });
}

// ================= LOAD =================

async function loadManga(){
    const snap = await db.collection("mangas").orderBy("createdAt","desc").get();
    mangas = [];
    snap.forEach(doc=> mangas.push({id:doc.id, ...doc.data()}));
    document.getElementById("loading").classList.add("hidden");
    await loadCategories();
    render();
    renderPopular();
}

// ================= POPULAR (ยอดนิยม: ยอดอ่าน + คะแนนรีวิว) =================

function popularScore(m){
    const views = Number(m.viewCount || 0);
    const rating = m.ratingCount ? (m.ratingTotal / m.ratingCount) : 0;
    // สูตร: ยอดอ่านหนักหลัก + คะแนนเฉลี่ยเป็นโบนัส (weight คะแนนเต็ม 5 = +50% ของ views)
    return views * (1 + (rating / 5) * 0.5);
}

async function renderPopular(){
    const box = document.getElementById("popularList");
    box.innerHTML = "";

    // เอา 10 เรื่องที่คะแนนรวมสูงสุด
    const top = [...mangas].sort((a,b)=> popularScore(b) - popularScore(a)).slice(0, 10);

    let rank = 0;
    for(const m of top){
        rank++;
        // หาตอนล่าสุด
        let latest = "—";
        try {
            const ch = await db.collection("mangas").doc(m.id)
                .collection("chapters").orderBy("chapter","desc").limit(1).get();
            if(!ch.empty) latest = "ตอนที่ " + ch.docs[0].data().chapter;
        } catch(e){}

        const rating = m.ratingCount ? (m.ratingTotal / m.ratingCount) : 0;
        const stars = "★".repeat(Math.round(rating)) + "☆".repeat(5 - Math.round(rating));

        const card = document.createElement("div");
        card.className = "popular-card";
        card.onclick = ()=> location.href = `detail.html?id=${m.id}`;

        card.innerHTML = `
            <span class="rank-badge r${rank}">${rank <= 3 ? ["🥇","🥈","🥉"][rank-1] : "#" + rank}</span>
            <span class="tag-badge pop-type">${m.type || "Manga"}</span>
            <img src="${m.coverUrl || 'https://via.placeholder.com/300x400'}">
            <div class="pop-info">
                <h4>${m.title}</h4>
                <p class="pop-ch">${latest}</p>
                <div class="pop-rating">
                    <span class="pop-stars">${stars}</span>
                    <span>${rating ? rating.toFixed(1) : "—"}</span>
                </div>
            </div>
        `;
        box.appendChild(card);
    }
}

// ================= RENDER =================

function timeAgo(ts){
    if(!ts || !ts.toMillis) return "";
    const mins = Math.floor((Date.now() - ts.toMillis())/60000);
    if(mins < 60) return `${mins} นาทีที่แล้ว`;
    if(mins < 1440) return `${Math.floor(mins/60)} ชม.ที่แล้ว`;
    return `${Math.floor(mins/1440)} วันที่แล้ว`;
}

function render(){
    const box = document.getElementById("manga-list");
    box.innerHTML = "";

    let text = (document.getElementById("searchInput")?.value || "").toLowerCase();

    let list = mangas.filter(m=>{
        const okSearch = m.title?.toLowerCase().includes(text);
        const cats = m.categories || (m.category ? [m.category] : []);
        const okCat = category==="ทั้งหมด" || cats.includes(category);
        const okMode = mode!=="bookmark" || isBookmarked(m.id);
        return okSearch && okCat && okMode;
    });

    if(list.length === 0){
        box.innerHTML = `<div class="empty">${mode==="bookmark" ? "ยังไม่มีบุ๊กมาร์ก 🔖" : "ไม่พบมังงะ"}</div>`;
        return;
    }

    list.forEach(m=>{
        const card = document.createElement("div");
        card.className = "manga-card";
        card.onclick = ()=> location.href = `detail.html?id=${m.id}`;

        card.innerHTML = `
            <button class="bookmark-btn ${isBookmarked(m.id)?"saved":""}" onclick="toggleBookmark('${m.id}', event)" title="${isBookmarked(m.id)?"ลบบุ๊กมาร์ก":"เพิ่มบุ๊กมาร์ก"}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="${isBookmarked(m.id)?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
            </button>
            <img src="${m.coverUrl || 'https://via.placeholder.com/300x400'}">
            <div class="manga-info">
                <span class="tag-badge">${m.type || "Manga"}</span>
                <h3 style="margin-top:8px;">${m.title}</h3>
                <div style="margin-top:6px; display:flex; flex-wrap:wrap; gap:4px;">
                    ${(m.categories || (m.category ? [m.category] : [])).filter(Boolean).slice(0,3).map(c=>`<span class="tag-badge cat cat-click" data-cat="${c}" style="font-size:10px; padding:2px 8px;">${c}</span>`).join("")}
                </div>
                <div class="manga-meta-row">
                    <span>👁️ ${Number(m.viewCount||0).toLocaleString("th-TH")}</span>
                    <span>${timeAgo(m.updatedAt || m.createdAt)}</span>
                </div>
            </div>
        `;

        // กดชิปแนว -> กรองไปหมวดนั้นทันที (ไม่เปิดหน้าเรื่อง)
        card.querySelectorAll(".cat-click").forEach(el=>{
            el.onclick = (e)=>{
                e.stopPropagation();
                category = el.dataset.cat;
                loadCategories();
                render();
                window.scrollTo({top:0, behavior:"smooth"});
            };
        });

        box.appendChild(card);
    });
}

loadManga();
</script>

</body>

</html>
