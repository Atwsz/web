<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">


<title>MANGA X Reader</title>

<link rel="stylesheet" href="style.css">

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>


<style>
/* ใช้ style.css หลักแล้ว — เพิ่มเฉพาะส่วนของ reader */

.top-bar .top-info{display:flex;flex-direction:column;min-width:0;}

.sidebar button{width:100%;margin-top:8px;}
</style>


</head>



<body>



<div class="top-bar">


<div class="top-info">

<div class="title" id="mangaTitle">

กำลังโหลด...

</div>

<div class="view-count" id="mangaViewCount">

👁️ 0 ยอดอ่าน

</div>

</div>


<div>


<button id="chapterBtn">

Ch.-

</button>


<button id="pageBtn">

Pg.-

</button>


<button id="menuBtn">

☰

</button>


</div>


</div>





<div class="manga-container" id="mangaContainer">

</div>




<button class="next-btn" onclick="nextChapter()">

ตอนถัดไป

</button>





<div class="sidebar" id="sidebar">


<button onclick="closeMenu()">
✖
</button>


<br><br>


<button onclick="location.href='index.html'">

หน้าหลัก

</button>


<h3>
เลือกตอน
</h3>


<select id="chapterSelect">

</select>



<h3>
เลือกหน้า
</h3>


<select id="pageSelect">

</select>



</div>







<script src="firebase.js"></script>

<script src="toast.js"></script>


<script>


// ================= URL =================


const params =
new URLSearchParams(location.search);



const mangaID =
params.get("id");


let currentEp =
params.get("ep") || "1";





// ================= DATA =================


let mangaData={};


let currentPage=1;



const container =
document.getElementById("mangaContainer");


const title =
document.getElementById("mangaTitle");


const chapterSelect =
document.getElementById("chapterSelect");


const pageSelect =
document.getElementById("pageSelect");



const chapterBtn =
document.getElementById("chapterBtn");


const pageBtn =
document.getElementById("pageBtn");


const viewCountEl =
document.getElementById("mangaViewCount");


function formatViewCount(value){

let count = Number(value) || 0;

return count.toLocaleString("th-TH");

}


async function trackView(){

if(!mangaID) return;

const key = `viewed:${mangaID}`;

if(sessionStorage.getItem(key)) return;

try {

await db.collection("mangas")
.doc(mangaID)
.set({
viewCount: firebase.firestore.FieldValue.increment(1)
}, { merge: true });

mangaData.viewCount = (Number(mangaData.viewCount || mangaData.views || 0) + 1);

sessionStorage.setItem(key, "1");

updateViewCount();

} catch (e) {

console.error("Track view failed", e);

}

}


function updateViewCount(){

if(!viewCountEl) return;

const count = Number(mangaData.viewCount || mangaData.views || 0);

viewCountEl.textContent = `👁️ ${formatViewCount(count)} ยอดอ่าน`;

}





// ================= LOAD =================


async function loadManga(){



if(!mangaID){

title.innerHTML="ไม่พบ ID มังงะ";

return;

}



let doc =

await db.collection("mangas")
.doc(mangaID)
.get();



if(!doc.exists){

title.innerHTML="ไม่พบมังงะ";

return;

}



mangaData =
doc.data();



title.innerHTML =
mangaData.title;





mangaData.viewCount = Number(mangaData.viewCount || mangaData.views || 0);

updateViewCount();

await trackView();

let chapters =

await db.collection("mangas")
.doc(mangaID)
.collection("chapters")
.orderBy("chapter","asc")
.get();





chapters.forEach(doc=>{


let data =
doc.data();



mangaData.chapters ??= {};



mangaData.chapters[data.chapter]={

pages:data.images

};




let option =
document.createElement("option");


option.value=data.chapter;


option.textContent=

"ตอนที่ "+data.chapter;



chapterSelect.appendChild(option);



});



loadChapter(currentEp);



}






// ================= LOAD PAGE =================



function loadChapter(ep){



currentEp=String(ep);



container.innerHTML="";


pageSelect.innerHTML="";



let pages =
mangaData.chapters[currentEp]?.pages;



if(!pages){

container.innerHTML="ไม่มีตอนนี้";

return;

}



pages.forEach((url,index)=>{



let img =
document.createElement("img");



img.src=url;


img.className="manga-page";



container.appendChild(img);




let option =
document.createElement("option");


option.value=index+1;


option.textContent=

"Page "+(index+1);



pageSelect.appendChild(option);



});



currentPage=1;


updateBar();



window.scrollTo(0,0);



}





// ================= BAR =================


function updateBar(){


chapterBtn.innerHTML=

"Ch."+currentEp;



pageBtn.innerHTML=

"Pg."+currentPage+

"/"+

mangaData.chapters[currentEp].pages.length;



}






// ================= NEXT =================


function nextChapter(){



let list =
Object.keys(mangaData.chapters)

.sort((a,b)=> parseFloat(a) - parseFloat(b));

let index =
list.indexOf(currentEp);

if(list[index+1]){


loadChapter(list[index+1]);

history.pushState(

null,

"",


"?id="+mangaID+"&ep="+encodeURIComponent(list[index+1])

);

}else{


alert("ยังไม่มีตอนถัดไป");


}



}






// ================= SELECT =================


chapterSelect.onchange=function(){


loadChapter(this.value);


history.pushState(

null,

"",


"?id="+mangaID+"&ep="+encodeURIComponent(this.value)

);


}




pageSelect.onchange=function(){


let img =

document.querySelectorAll(".manga-page")

[this.value-1];



img?.scrollIntoView({

behavior:"smooth"

});


}





// ================= MENU =================


menuBtn.onclick=function(){

sidebar.classList.add("active");

}



function closeMenu(){

sidebar.classList.remove("active");

}




loadManga();



</script>


</body>

</html>
